<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Suspicious Sign-in Triage</title>
  <desc id="description">Synthetic timeline: two failed sign-ins followed by a successful sign-in 61 seconds after the first failure.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#41735b" opacity=".4"/>
    </pattern>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#142b22"/>
      <stop offset="1" stop-color="#090e0c"/>
    </linearGradient>
  </defs>

  <path fill="url(#background)" d="M0 0h960v600H0z"/>
  <path fill="url(#grid)" d="M0 0h960v600H0z"/>
  <rect x="36" y="36" width="888" height="528" rx="22" fill="#101b16" stroke="#355343" stroke-width="2"/>
  <path d="M72 89h26" stroke="#9bf4b9" stroke-width="3"/>
  <text x="114" y="96" fill="#9bf4b9" font-family="monospace" font-size="21" letter-spacing="2">SOC LAB / SYNTHETIC EVENTS</text>
  <text x="72" y="174" fill="#edf4ee" font-family="system-ui, sans-serif" font-size="58" font-weight="700">Suspicious sign-in</text>
  <text x="74" y="221" fill="#aebfb4" font-family="system-ui, sans-serif" font-size="28">Same source. Three events in 61 seconds.</text>

  <g fill="#17251e" stroke="#324c3c" stroke-width="2">
    <rect x="72" y="260" width="816" height="74" rx="12"/>
    <rect x="72" y="350" width="816" height="74" rx="12"/>
    <rect x="72" y="440" width="816" height="74" rx="12" stroke="#5d9e75"/>
  </g>
  <g fill="none" stroke-width="3">
    <circle cx="113" cy="297" r="12" stroke="#ffb58e"/>
    <path d="m109 293 8 8m0-8-8 8" stroke="#ffb58e"/>
    <circle cx="113" cy="387" r="12" stroke="#ffb58e"/>
    <path d="m109 383 8 8m0-8-8 8" stroke="#ffb58e"/>
    <circle cx="113" cy="477" r="12" stroke="#9bf4b9"/>
    <path d="m108 477 4 4 7-8" stroke="#9bf4b9"/>
  </g>
  <g fill="#edf4ee" font-family="monospace" font-size="27">
    <text x="151" y="306">09:14:02</text>
    <text x="151" y="396">09:14:19</text>
    <text x="151" y="486">09:15:03</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="29" font-weight="600" text-anchor="end">
    <text x="850" y="306" fill="#ffb58e">Failed</text>
    <text x="850" y="396" fill="#ffb58e">Failed</text>
    <text x="850" y="486" fill="#9bf4b9">Success</text>
  </g>
</svg>
